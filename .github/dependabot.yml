version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: '15:00'
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
      include:
        - '*'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: '15:00'
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
      semver-patch-days: 7
      include:
        - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      composer-patch:
        update-types:
          - patch
      composer-minor:
        update-types:
          - minor
      composer-major:
        update-types:
          - major
      composer-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: '15:00'
      timezone: Europe/Berlin
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
      semver-patch-days: 7
      include:
        - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      npm-patch:
        update-types:
          - patch
      npm-minor:
        update-types:
          - minor
      npm-major:
        update-types:
          - major
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
